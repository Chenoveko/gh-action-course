name: 04 - Workflow Actions
on: push

jobs:
  build-job:
    defaults:
      run:
        working-directory: react-app/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests
        run: npm run test