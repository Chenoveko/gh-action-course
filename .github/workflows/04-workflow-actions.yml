name: 04 - Workflow Actions
on: push

jobs:
  build-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Printing Folders
        run: ls
      - name: Setup Node
        uses: actions/setup-node@v6
      - name: Install Dependencies
        run: npm ci
        working-directory: react-app/