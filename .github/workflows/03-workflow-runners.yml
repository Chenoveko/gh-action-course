name: 03 - Workflow Runners
on: push

jobs:
  ubuntu-job:
    runs-on: ubuntu-latest
    steps:
      - name: Show Ubuntu OS
        run: |
          echo "This job is running on an Ubuntu runner"
          echo "Runner OS: $RUNNER_OS"

  windows-job:
    runs-on: windows-latest
    steps:
      - name: Show Ubuntu OS
        shell: bash
        run: |
          echo "This job is running on an Ubuntu runner"
          echo "Runner OS: $RUNNER_OS"